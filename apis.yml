aid: fibraweb-spa
name: Fibraweb, S.p.a.
description: >-
  Fibraweb S.p.A. is an Italian telecommunications infrastructure operator,
  founded in 2012 and headquartered in Perugia (Umbria), that designs, builds
  and operates its own fiber-optic access network for businesses, wholesale
  operators and public administrations. The company delivers FTTH/FTTB
  ultra-broadband internet access, dedicated internet access circuits, and
  local and long-distance voice/telephony services across the Umbria, Marche,
  Toscana and Lazio regions, with a proprietary network of roughly 1,500 km of
  fiber reaching 150 industrial zones and the ability to connect over 30,000
  companies. Fibraweb is a Battery Ventures portfolio company (investors also
  include Equiter and GTD Grupo Teleductos) and holds ISO 9001, ISO/IEC 27001
  and ISO/IEC 27017 certifications. It was added to the API Evangelist network
  as a portfolio lead; the company does not currently publish a public
  developer API, developer portal, or API documentation.
